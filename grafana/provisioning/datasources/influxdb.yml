apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: smart-litter
      defaultBucket: litter_monitor
    secureJsonData:
      token: slm-dev-token-change-in-production
    isDefault: true
    editable: true
